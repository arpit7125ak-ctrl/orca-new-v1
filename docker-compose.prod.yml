# orca/docker-compose.prod.yml
# ---------------------------------------------------------------------------
# Production Override for Domain Deployment with Automated SSL (Certbot)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ---------------------------------------------------------------------------

version: '3.8'

volumes:
  certbot_etc:
  certbot_var:

services:
  # In production, frontend is exposed through reverse-proxy on 80/443
  frontend:
    ports: !override []
    expose:
      - "80"

  # Production Reverse Proxy with SSL termination & security headers
  reverse-proxy:
    image: nginx:alpine
    container_name: orca-ssl-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - orca_net

  # Automatic Let's Encrypt Certificate Renewal
  certbot:
    image: certbot/certbot
    container_name: orca-certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

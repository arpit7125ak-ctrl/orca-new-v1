# orca/docker-compose.yml
# ---------------------------------------------------------------------------
# ORCA Maritime Platform — Complete Production Container Stack
# ---------------------------------------------------------------------------

version: '3.8'

networks:
  orca_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local

services:
  # --- 1. Persistent MongoDB -----------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: orca-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - orca_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. Python AI Service (Planner & Specialized Agents) -----------------
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: orca-ai-service
    restart: unless-stopped
    environment:
      - ENV=production
      - AI_SERVICE_PORT=8000
      - BACKEND_INTERNAL_URL=http://backend:4100
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=orca
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADAPTER_MODE=${ADAPTER_MODE:-live}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - orca_net
    expose:
      - "8000"

  # --- 3. Node.js Backend Gateway (Public & Protected Internal) ------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orca-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - INTERNAL_PORT=4100
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://mongo:27017/orca
      - AI_SERVICE_URL=http://ai-service:8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "4000:4000"
    expose:
      # Port 4100 is internal-only to orca_net; never exposed to public internet
      - "4100"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - orca_net

  # --- 4. React Frontend (Vite + Nginx) -----------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: orca-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - orca_net
